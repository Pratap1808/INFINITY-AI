services:
  - type: web
    name: infinity-ai
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_JWT_SECRET
        generateValue: true
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: RP_NAME
        value: INFINITY AI
      - key: RP_ID
        sync: false
      - key: ORIGIN
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
